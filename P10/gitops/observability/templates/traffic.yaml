apiVersion: v1
kind: ConfigMap
metadata:
  name: p10-traffic-client
  namespace: sa-p9
data:
  traffic.mjs: |
{{ .Files.Get "files/traffic.mjs" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: p10-traffic-client
  namespace: sa-p9
spec:
  suspend: true
  schedule: '0 0 1 1 *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: p10-traffic-client
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
          containers:
            - name: traffic
              image: ghcr.io/dominicruano/sa-p8/gateway:1.10.1@sha256:9350c81ff8e0c77a437ac25908899b2c3c9819bb66f1ec17b74049ad8761c790
              command: [node, /scripts/traffic.mjs]
              args: ['http://gateway-canary:8080', '1800', '/tmp/evidencias']
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 200m, memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: temporary, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: p10-traffic-client}
            - name: temporary
              emptyDir: {sizeLimit: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p10-traffic-client
  namespace: sa-p9
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: p10-traffic-client}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p10-traffic-to-gateway
  namespace: sa-p9
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: p10-traffic-client}
      ports:
        - {protocol: TCP, port: 8080}
