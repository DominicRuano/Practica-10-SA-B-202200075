fullnameOverride: p10-monitoring
defaultRules:
  create: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubelet:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi
prometheus:
  prometheusSpec:
    scrapeInterval: 10s
    evaluationInterval: 10s
    retention: 24h
    retentionSize: 6GB
    enableAdminAPI: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
alertmanager:
  config:
    global:
      resolve_timeout: 1m
    route:
      receiver: operacion
      group_by:
      - alertname
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 1h
      routes:
      - receiver: operacion
        matchers:
        - practice="p10"
    receivers:
    - name: operacion
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
grafana:
  admin:
    existingSecret: p10-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  testFramework:
    enabled: false
  persistence:
    enabled: true
    storageClassName: standard-rwo
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: observabilidad
    datasources:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://p10-monitoring-prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://p10-loki:3100
        jsonData:
          derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
            datasourceUid: tempo
            url: $${__value.raw}
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://p10-tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            filterByTraceID: false
            customQuery: true
            query: '{service_name=~"gateway|solicitudes|catalogo"} | json | trace_id="$${__trace.traceId}"'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
